<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Google Review...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      margin: 0;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a.btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      background-color: #1a73e8;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
    }
  </style>
  <script>
    const SHEET_CSV = "https://docs.google.com/spreadsheets/d/1lQUSR6J_ECkic4WziqpGFksxnIS0P2VKMkApOZ4jy1k/export?format=csv";

    async function redirect() {
      const params = new URLSearchParams(window.location.search);
      const targetId = params.get("id");

      if (!targetId) {
        document.getElementById("status").innerText = "Error: Missing QR ID in the link.";
        document.getElementById("spinner").style.display = "none";
        return;
      }

      try {
        const res = await fetch(SHEET_CSV);
        if (!res.ok) throw new Error("Could not access Google Sheet. Verify it is set to 'Anyone with link can view'.");

        const text = await res.text();
        const rows = text.split("\n").map(r => r.split(","));

        for (const row of rows) {
          const id = row[0] ? row[0].trim() : "";
          const destination = row[2] ? row[2].trim().replace(/\r/g, "") : "";

          if (id.toLowerCase() === targetId.toLowerCase()) {
            if (destination && destination.startsWith("http")) {
              // Immediate automatic redirect
              window.location.replace(destination);
              
              // Fallback button if the browser blocks automatic navigation
              setTimeout(() => {
                document.getElementById("status").innerHTML = 
                  '<p>If it did not open automatically:</p>' +
                  '<a class="btn" href="' + destination + '">Tap here to open Google Review</a>';
                document.getElementById("spinner").style.display = "none";
              }, 1500);
              return;
            }
            document.getElementById("status").innerText = "No review link assigned to " + id + " yet.";
            document.getElementById("spinner").style.display = "none";
            return;
          }
        }

        document.getElementById("status").innerText = "ID " + targetId + " was not found in the spreadsheet.";
        document.getElementById("spinner").style.display = "none";
      } catch (err) {
        document.getElementById("status").innerText = "Error: " + err.message;
        document.getElementById("spinner").style.display = "none";
      }
    }

    window.onload = redirect;
  </script>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div id="status">Connecting to Google Reviews...</div>
</body>
</html>
