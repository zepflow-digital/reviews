<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Google Review...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      margin: 0;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a.btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      background-color: #1a73e8;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div id="status">Connecting to Google Reviews...</div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9PZklUVh7-iTFoT8Oj1bKv9ZkxvnMH6lYjqRo2D0lgfyz93EuOJTE0YQu7lqdDN9BQQ/exec";

    async function loadDestination() {
      const params = new URLSearchParams(window.location.search);
      const targetId = params.get("id");

      if (!targetId) {
        document.getElementById("status").innerText = "Error: Missing QR ID in the link.";
        document.getElementById("spinner").style.display = "none";
        return;
      }

      try {
        const fetchUrl = SCRIPT_URL + "?id=" + encodeURIComponent(targetId);
        const response = await fetch(fetchUrl, {
          method: "GET",
          redirect: "follow"
        });

        const data = await response.json();

        if (data && data.destination && data.destination.startsWith("http")) {
          window.location.replace(data.destination);

          setTimeout(() => {
            document.getElementById("status").innerHTML = 
              '<p>If it did not open automatically:</p>' +
              '<a class="btn" href="' + data.destination + '">Tap here to open Google Review</a>';
            document.getElementById("spinner").style.display = "none";
          }, 1500);
        } else {
          document.getElementById("status").innerText = "No review link assigned to " + targetId + " yet.";
          document.getElementById("spinner").style.display = "none";
        }
      } catch (err) {
        document.getElementById("status").innerText = "Error: " + err.message;
        document.getElementById("spinner").style.display = "none";
      }
    }

    window.onload = loadDestination;
  </script>
</body>
</html>
