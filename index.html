<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Google Review...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      margin: 0;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a.btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      background-color: #1a73e8;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div id="status">Connecting to Google Reviews...</div>

  <script>
    const SHEET_ID = "1lQUSR6J_ECkic4WziqpGFksxnIS0P2VKMkApOZ4jy1k";
    const params = new URLSearchParams(window.location.search);
    const targetId = params.get("id");

    function handleSheetData(response) {
      if (!targetId) {
        document.getElementById("status").innerText = "Error: Missing QR ID in the link.";
        document.getElementById("spinner").style.display = "none";
        return;
      }

      try {
        const rows = response.table.rows;
        for (const row of rows) {
          // Column A is index 0 (QR ID), Column C is index 2 (Review Link)
          const id = row.c[0] && row.c[0].v ? String(row.c[0].v).trim() : "";
          const destination = row.c[2] && row.c[2].v ? String(row.c[2].v).trim() : "";

          if (id.toLowerCase() === targetId.toLowerCase()) {
            if (destination && destination.startsWith("http")) {
              window.location.replace(destination);
              
              setTimeout(() => {
                document.getElementById("status").innerHTML = 
                  '<p>If it did not open automatically:</p>' +
                  '<a class="btn" href="' + destination + '">Tap here to open Google Review</a>';
                document.getElementById("spinner").style.display = "none";
              }, 1500);
              return;
            }
            document.getElementById("status").innerText = "No review link assigned to " + id + " yet.";
            document.getElementById("spinner").style.display = "none";
            return;
          }
        }

        document.getElementById("status").innerText = "ID " + targetId + " was not found in the spreadsheet.";
        document.getElementById("spinner").style.display = "none";
      } catch (err) {
        document.getElementById("status").innerText = "Error parsing sheet: " + err.message;
        document.getElementById("spinner").style.display = "none";
      }
    }

    window.onload = function() {
      if (!targetId) {
        document.getElementById("status").innerText = "Error: Missing QR ID in the link.";
        document.getElementById("spinner").style.display = "none";
        return;
      }

      // JSONP bypasses CORS completely by loading as a script tag
      const script = document.createElement("script");
      script.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=responseHandler:handleSheetData&_t=" + Date.now();
      script.onerror = function() {
        document.getElementById("status").innerText = "Error: Could not connect to Google Sheets. Verify the sheet is shared with 'Anyone with the link'.";
        document.getElementById("spinner").style.display = "none";
      };
      document.body.appendChild(script);
    };
  </script>
</body>
</html>
